<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uma coisinha pra você ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--rose:#e8678a;--rose-d:#c94f74;--ink:#6b3a4a;--bg1:#fff5f8;--bg2:#ffdce8;--card:rgba(255,255,255,.88);
--script:'Great Vibes','Snell Roundhand','Brush Script MT',cursive;--sans:'Quicksand',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{min-height:100vh;font-family:var(--sans);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.h{position:absolute;bottom:-40px;opacity:0;animation:float linear infinite;color:var(--rose)}
@keyframes float{0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}12%{opacity:.4}85%{opacity:.25}100%{transform:translateY(-110vh) translateX(var(--dx)) rotate(25deg);opacity:0}}
.page{position:relative;z-index:1;min-height:100vh}
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;min-height:100vh;gap:28px}
.bigheart{font-size:84px;line-height:1;animation:beat 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(232,103,138,.35))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}60%{transform:scale(1)}}
.home h1{font-family:var(--script);font-weight:400;font-size:clamp(40px,10vw,64px);color:var(--rose-d);line-height:1.2;max-width:12em}
.btn{font-family:var(--sans);font-weight:600;font-size:17px;color:#fff;border:0;cursor:pointer;padding:15px 34px;border-radius:999px;
background:linear-gradient(135deg,#f08aa6,var(--rose-d));box-shadow:0 10px 24px rgba(201,79,116,.3);transition:transform .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(201,79,116,.35)}
.btn:active{transform:scale(.95);box-shadow:0 4px 12px rgba(201,79,116,.3)}
.btn.soft{background:#fff;color:var(--rose-d);box-shadow:0 8px 20px rgba(201,79,116,.18)}
.letter{max-width:640px;margin:0 auto;padding:28px 18px 56px;display:flex;flex-direction:column;align-items:center;gap:26px}
.reveal{opacity:0;transform:translateY(28px);animation:rev 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.reveal.d2{animation-delay:.6s}.reveal.d3{animation-delay:1.1s}
@keyframes rev{to{opacity:1;transform:none}}
.imgwrap{width:100%;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 14px 36px rgba(201,79,116,.22);border:6px solid #fff}
.imgwrap img{display:block;width:100%;height:auto}
.cap{padding:14px 10px 18px;text-align:center;font-family:var(--script);font-size:34px;color:var(--rose-d);background:#fff}
.ph{padding:56px 20px;text-align:center;font-family:var(--script);font-size:30px;color:var(--rose)}
.card{width:100%;background:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:24px;padding:34px 26px;box-shadow:0 12px 32px rgba(201,79,116,.15);border:1px solid rgba(255,255,255,.9)}
.card p{font-size:17px;line-height:1.85;margin-bottom:1.25em;font-weight:500}
.card p:last-child{margin-bottom:0}
.card p.first{font-family:var(--script);font-size:34px;line-height:1.3;color:var(--rose-d);font-weight:400}
.music{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);
color:var(--rose-d);font-size:20px;cursor:pointer;box-shadow:0 6px 16px rgba(201,79,116,.22);display:none}
.music.on{display:block}.music.play{animation:beat 1.6s infinite}
@media (prefers-reduced-motion:reduce){.h,.bigheart,.music.play{animation:none}.reveal{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>
<button class="music" id="music" aria-label="Música" title="Música">♪</button>
<audio id="audio" loop preload="none"></audio>
<main class="page" id="app"></main>

/* ===== CORAÇÕES FLUTUANTES ===== */
(function(){
  const box=document.getElementById('hearts');
  const sym=['♥','❤','♡'];
  const n=window.innerWidth<600?12:20;
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='h';
    s.textContent=sym[i%3];
    s.style.left=Math.random()*100+'%';
    s.style.fontSize=(12+Math.random()*18)+'px';
    s.style.animationDuration=(14+Math.random()*14)+'s';
    s.style.animationDelay=(-Math.random()*20)+'s';
    s.style.setProperty('--dx',(Math.random()*80-40)+'px');
    box.appendChild(s);
  }
})();

/* ===== MÚSICA ===== */
const audio=document.getElementById('audio'), mbtn=document.getElementById('music');
if(MUSIC_SRC){
  audio.src=MUSIC_SRC; mbtn.classList.add('on');
  mbtn.onclick=()=>{
    if(audio.paused){audio.play().then(()=>mbtn.classList.add('play')).catch(()=>{})}
    else{audio.pause();mbtn.classList.remove('play')}
  };
}

/* ===== ROTAS (hash: "#/" e "#/surpresa") ===== */
const app=document.getElementById('app');
function home(){
  app.innerHTML=`<section class="home">
    <div class="bigheart" aria-hidden="true">❤️</div>
    <h1>Preparei uma coisinha pra você... ❤️</h1>
    <button class="btn" id="go">Veja a surpresa ✨</button>
  </section>`;
  document.getElementById('go').onclick=()=>{location.hash='#/surpresa'};
}
function surpresa(){
  const img=IMG_SRC
    ? `<img src="${IMG_SRC}" alt="Foto dela"><div class="cap">Feliz aniversário ❤️</div>`
    : `<div class="ph">Feliz aniversário ❤️</div>`;
  const paras=MENSAGEM.map((t,i)=>`<p class="${i===0?'first':''}">${t}</p>`).join('');
  app.innerHTML=`<section class="letter" id="top">
    <div class="imgwrap reveal">${img}</div>
    <div class="card reveal d2">${paras}</div>
    <button class="btn soft reveal d3" id="again">Ler novamente ❤️</button>
  </section>`;
  document.getElementById('again').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
}
function route(){
  window.scrollTo(0,0);
  (location.hash==='#/surpresa'?surpresa:home)();
}
window.addEventListener('hashchange',route);
route();
</script>
